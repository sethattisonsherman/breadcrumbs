name: Deploy Constellations to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify learning contracts and progress compatibility
        run: node --test tests/async.test.js tests/learning.test.js tests/journey.test.js tests/framework-provider.test.js tests/ai-plan.test.js tests/db-config.test.js
      - name: Build offline browser regression fixture
        run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
          VITE_TURNSTILE_SITE_KEY: ""
          VITE_API_BASE_URL: ""
      - name: Verify the complete Pages learning journey
        run: npm run test:pages
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Build the production frontend
        run: npm run build:pages
        env:
          # These are public browser settings. Never put secret keys in VITE_ variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
